services:
  - type: web
    name: planty
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"

  - type: web
    name: llm-council
    runtime: python
    buildCommand: pip install fastapi uvicorn python-dotenv httpx pydantic
    startCommand: cd llm-council && python -m backend.main
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"
