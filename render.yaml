# Render Blueprint — Planty v2
# Backend: FastAPI web service with auto-deploy on master push

services:
  - type: web
    name: planty-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: yes
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: planty-db
          property: connectionString

databases:
  - name: planty-db
    plan: free
    region: oregon
