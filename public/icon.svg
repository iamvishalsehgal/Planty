      <stop offset="100%" stop-color="#4F7A42"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BD935C"/>
      <stop offset="100%" stop-color="#976835"/>
